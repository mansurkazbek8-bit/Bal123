<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ұстазды тап!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd54a;--pink:#ff5fa2;--cy:#4de1ff;--ok:#2fe68b;--bad:#ff5c5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:#fff;background:#1a0b3d}
#bg{position:fixed;inset:0;background:linear-gradient(120deg,#2a0f6b,#7a1fa2,#e0439b,#ff9a3c,#2a0f6b);background-size:400% 400%;animation:flow 18s ease infinite;z-index:0}
@keyframes flow{50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.b1{width:40vmax;height:40vmax;background:var(--cy);left:-10vmax;top:-10vmax}
.b2{width:34vmax;height:34vmax;background:var(--gold);right:-8vmax;bottom:-8vmax;animation-delay:-5s}
.b3{width:26vmax;height:26vmax;background:var(--pink);left:40%;top:30%;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.25)}}
#float{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.fl{position:absolute;bottom:-60px;font-size:28px;opacity:.8;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(360deg)}}
#stage{position:relative;z-index:2;height:100%}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4vh 6vw 12vh;text-align:center;opacity:0;visibility:hidden;transform:scale(.92) translateY(30px);transition:all .6s cubic-bezier(.2,.9,.3,1.2)}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide>*{opacity:0;transform:translateY(30px)}
.slide.on>*{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) forwards}
.slide.on>*:nth-child(2){animation-delay:.2s}.slide.on>*:nth-child(3){animation-delay:.4s}.slide.on>*:nth-child(4){animation-delay:.6s}
@keyframes pop{to{opacity:1;transform:none}}
h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(40px,9vw,110px);line-height:1.05;background:linear-gradient(90deg,#fff,var(--gold),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite,pop .7s forwards;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
@keyframes shine{to{background-position:200% 0}}
h2{font-size:clamp(22px,4.2vw,50px);font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.35);max-width:1100px}
.sub{font-size:clamp(16px,2.4vw,28px);opacity:.95;margin-top:2vh;font-weight:800}
.big{font-size:clamp(70px,14vw,170px);display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-16px) rotate(6deg)}}
.card{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid rgba(255,255,255,.35);border-radius:28px;padding:3vh 3vw;max-width:980px;font-size:clamp(16px,2.5vw,30px);font-weight:800;line-height:1.5;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.tag{display:inline-block;padding:8px 22px;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ff9a3c);color:#3a1160;font-weight:900;font-size:clamp(14px,2vw,24px);margin-bottom:2vh;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.07)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw;margin-top:3.5vh;width:min(960px,100%)}
.o{display:flex;align-items:center;gap:14px;text-align:left;padding:2vh 1.6vw;border-radius:22px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);font-weight:800;font-size:clamp(15px,2.3vw,28px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;transition:.3s;opacity:0}
.slide.on .o{animation:pop .6s forwards}
.slide.on .o:nth-child(1){animation-delay:.7s}.slide.on .o:nth-child(2){animation-delay:.9s}.slide.on .o:nth-child(3){animation-delay:1.1s}.slide.on .o:nth-child(4){animation-delay:1.3s}
.o:hover{transform:scale(1.04);background:rgba(255,255,255,.28)}
.o b{flex:none;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3a1160;font-weight:900}
.o.right{background:linear-gradient(90deg,#17c76f,#2fe68b);border-color:#fff;animation:win .8s ease infinite alternate!important;opacity:1}
@keyframes win{to{transform:scale(1.07);box-shadow:0 0 40px 8px rgba(47,230,139,.7)}}
.o.wrong{opacity:.3!important;animation:none!important;filter:grayscale(.8)}
.btn{margin-top:3vh;padding:14px 34px;border:0;border-radius:99px;font:900 clamp(16px,2.2vw,26px) 'Nunito';color:#3a1160;background:linear-gradient(90deg,var(--gold),#ff9a3c);cursor:pointer;box-shadow:0 8px 0 #b86b00,0 16px 30px rgba(0,0,0,.3);transition:.15s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #b86b00}
.timer{width:min(420px,70%);height:12px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:2vh}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--gold),var(--bad));transform-origin:left}
.timer i.run{animation:tm 20s linear forwards}
@keyframes tm{to{transform:scaleX(0)}}
#nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;align-items:center;gap:14px}
#nav button{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.2s}
#nav button:hover{background:rgba(255,255,255,.4);transform:scale(1.1)}
#dots{display:flex;gap:8px}
#dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.4);transition:.4s}
#dots i.a{background:var(--gold);transform:scale(1.7);box-shadow:0 0 12px var(--gold)}
#bar{position:fixed;top:0;left:0;height:6px;z-index:6;background:linear-gradient(90deg,var(--cy),var(--gold),var(--pink));transition:width .6s}
canvas{position:fixed;inset:0;z-index:9;pointer-events:none}
.gift{font-size:clamp(60px,12vw,140px);cursor:pointer;display:inline-block;animation:shake 1.4s infinite}
@keyframes shake{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) scale(1.1)}20%{transform:rotate(12deg) scale(1.1)}30%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}}
@media(max-width:640px){.opts{grid-template-columns:1fr}.slide{padding-bottom:14vh;overflow:auto;justify-content:flex-start;padding-top:8vh}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="float"></div><div id="bar"></div>
<div id="stage"></div>
<div id="nav"><button id="prev" aria-label="Артқа">‹</button><div id="dots"></div><button id="next" aria-label="Алға">›</button><button id="fs" aria-label="Толық экран" style="font-size:18px">⛶</button></div>
<canvas id="cv"></canvas>
<script>
const Q=[
{q:"Мектепте бір нәрсе бар: оны барлық мұғалім күнде көреді, бірақ оны ешкім қолымен ұстай алмайды. Ол не?",o:["Баға","Уақыт","Көңіл-күй","Сабақ"],a:1,e:"⏰",t:"Дұрыс жауап: Б — уақыт"},
{q:"Оқушы сабақта үндемей отыр, бірақ мұғалім оның сабаққа қатысып отырғанын біледі. Қалай?",o:["Ол жазып отыр","Ол мұғалімге қарап отыр","Ол басын изеп отыр","Барлығы дұрыс болуы мүмкін"],a:3,e:"🤫",t:"Дұрыс жауап: Г"},
{q:"Мұғалім сыныпқа кіргенде бірден оқушылардың бәрі оған қарайды. Неліктен?",o:["Мұғалім әдемі киінген","Мұғалім сөйлей бастады","Мұғалім тақтаға қарады","Сабақ басталатынын білді"],a:3,e:"👀",t:"Дұрыс жауап: Г"},
{q:"Мұғалімнің ең жиі айтатын сөзі қайсы болуы мүмкін?",o:["«Тыныштық сақтайық!»","«Кім жауап береді?»","«Дәптерді ашыңдар!»","«Бәрі дұрыс!»"],a:0,e:"📢",t:"Дұрыс жауап: А"},
{q:"Мұғалім сыныпқа кірді. Бір оқушы орнынан тұрмады. Мұғалім оған ұрыспады. Неліктен?",o:["Оқушы ұйықтап отырды","Оқушы кезекші болды","Оқушы орнынан тұра алмайды","Мұғалім байқамады"],a:2,e:"🔥",t:"Дұрыс жауап: В",hot:1}
];
const L="АБВГ";let S=[],cur=0,revealed=false;
const st=document.getElementById('stage');
function add(h){const d=document.createElement('section');d.className='slide';d.innerHTML=h;st.appendChild(d);S.push(d);return d}
add(`<div class="big">🍎</div><h1>Ұстазды тап!</h1><div class="sub">✨ Ұстаздар күніне арналған ойын ✨</div>`);
add(`<div class="tag">🎯 Ойын</div><h2>Мақсаты</h2><div class="card">Мұғалімдердің <span style="color:var(--gold)">тапқырлығын</span>, <span style="color:var(--cy)">байқағыштығын</span> және <span style="color:#ff8fc2">логикалық ойлау қабілетін</span> тексеру, көңілді әрі қызықты орта қалыптастыру.</div>`);
add(`<div class="tag">📜 Ереже</div><h2>Ойын шарты</h2><div class="card">Жүргізуші <b>5 сұрақ</b> оқиды. Әр сұраққа <b>А, Б, В, Г</b> жауап нұсқалары беріледі. Мұғалімдер дұрыс деп ойлаған жауабын таңдайды.<br>Әр сұраққа дұрыс жауап берген мұғалім <b>1 сыйлықтан</b> алады! 🎁<br>Өз біліміңіз бен тапқырлығыңызды көрсетіңіз!</div>`);
Q.forEach((x,i)=>add(`<div class="tag">${x.e} ${i+1}-сұрақ${x.hot?' 🔥':''}</div><h2>${x.q}</h2><div class="opts">${x.o.map((t,j)=>`<div class="o" data-j="${j}"><b>${L[j]}</b>${t}</div>`).join('')}</div><div class="timer"><i></i></div><button class="btn rv">🎁 Жауапты көрсету</button>`));
add(`<div class="gift" id="gift">🎁</div><h1>Құттықтаймыз!</h1><div class="sub">Бәріңізге рақмет! Сіздер — біздің мақтанышымыз 💛<br>Ұстаздар күні құтты болсын! 🌷</div>`);
const dots=document.getElementById('dots');S.forEach(()=>dots.appendChild(document.createElement('i')));
function go(n){if(n<0||n>=S.length)return;cur=n;revealed=false;
S.forEach((s,i)=>{s.classList.toggle('on',i===n);if(i===n){s.querySelectorAll('.o').forEach(o=>o.className='o');const t=s.querySelector('.timer i');if(t){t.classList.remove('run');void t.offsetWidth;t.classList.add('run')}const b=s.querySelector('.rv');if(b){b.textContent='🎁 Жауапты көрсету'}}});
[...dots.children].forEach((d,i)=>d.classList.toggle('a',i===n));
document.getElementById('bar').style.width=((n+1)/S.length*100)+'%';
if(n===0||n===S.length-1)boom(innerWidth/2,innerHeight/3,150)}
function reveal(){const qi=cur-3;if(qi<0||qi>=Q.length)return false;if(revealed)return false;revealed=true;
const s=S[cur];s.querySelectorAll('.o').forEach((o,j)=>o.classList.add(j===Q[qi].a?'right':'wrong'));
s.querySelector('.rv').textContent='✅ '+Q[qi].t;const r=s.querySelector('.right').getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2,160);return true}
function next(){if(!reveal())go(cur+1)}
st.addEventListener('click',e=>{if(e.target.closest('.rv'))reveal();else if(e.target.closest('.o')){const j=+e.target.closest('.o').dataset.j,qi=cur-3;if(qi>=0&&!revealed){reveal()}}else if(e.target.id==='gift'){boom(e.clientX,e.clientY,250)}});
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{if(['ArrowRight',' ','Enter','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1)});
let tx=0;addEventListener('touchstart',e=>tx=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70)d<0?next():go(cur-1)});
// floating emojis
const fe=['📚','✏️','🍎','⭐','🎓','💡','🌷','🔔','🎈','🧠','🏆'],fl=document.getElementById('float');
setInterval(()=>{const e=document.createElement('div');e.className='fl';e.textContent=fe[Math.random()*fe.length|0];e.style.left=Math.random()*100+'vw';e.style.fontSize=(20+Math.random()*30)+'px';e.style.animationDuration=(8+Math.random()*8)+'s';fl.appendChild(e);setTimeout(()=>e.remove(),17000)},600);
// confetti
const cv=document.getElementById('cv'),c=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
const col=['#ffd54a','#ff5fa2','#4de1ff','#2fe68b','#fff','#ff9a3c'];
function boom(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*11;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:5+Math.random()*8,c:col[i%col.length],r:Math.random()*6,vr:Math.random()*.4-.2,l:110+Math.random()*60})}if(P.length===n)loop()}
function loop(){c.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.r+=p.vr;p.l--;c.save();c.globalAlpha=Math.min(1,p.l/40);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore()});if(P.length)requestAnimationFrame(loop)}
go(0);
</script>
</body>
</html>
